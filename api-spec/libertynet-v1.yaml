        so a transient client bug does not burn the binding.
      tags: [Node]
      security: []
      x-ln-status: implemented
      parameters:
        - { name: binding_session_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [acceptance]
              properties:
                acceptance:
                  type: object
                  description: Node's signed acceptance of the specific authorization.
      responses:
        '200':
          description: Binding is ACTIVE.
          content:
            application/json:
              schema:
                type: object
                properties:
                  binding_session_id: { type: string }
                  state: { const: ACTIVE }
                  binding: { type: object, description: The stored operator↔node relation. }
        '401':
          description: A signature in the chain failed re-verification.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: '`ALREADY_ACTIVE` or `BAD_STATE`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }


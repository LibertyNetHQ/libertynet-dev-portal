openapi: 3.1.0
info:
  title: LibertyNet API
  version: 1.0.0
  summary: >-
    Node discovery, operator identity, node↔operator binding, and the coordination loop that
    turns an Intent into a delivered Result and a signed Receipt.
  description: |
    The LibertyNet public API. Everything documented here with `x-ln-status: implemented` is
    live right now and was probed on the date recorded in `api-spec/status.json`.

    ## Current scope

    Two live surfaces, and they are different hosts because they are different services:

    | Surface | Base URL | What it does |
    |---|---|---|
    | Registry | `https://registry.libertynet.ai` | Discovery, operator identity, node binding. |
    | Coordination | `https://libertynet.ai/coordination` | Intent → Proposal → Commitment → authorize → Result → Receipt, executed on a real provider fleet. |

    Coordination is **implemented and callable today**, not planned: `POST /v1/intents` opens a
    session, `POST /v1/sessions/{session_id}/authorize` runs the work on a real node, and
    `GET /v1/sessions/{session_id}/receipt` returns a Receipt naming the provider that did it.
    Earlier revisions of this document described that loop as unbuilt. It is built, and there is
    an application using it: `https://libertynet.ai/compute` is the Compute App, which reaches
    the platform over exactly these public endpoints and no private ones.

    Two things the Receipt does **not** mean. The `settlement.amount` it carries is an
    accounting record: fuel settlement is deliberately unwired on this deployment (no rate card
    is provisioned) so no delivery is charged and no value moves. And the coordinator identity
    is stable but not yet endorsed under the operator key hierarchy.

    Coordination is not the same thing as the **trading** intents under
    [Intents](/concepts/intents) — those are `planned`, have no endpoint, and are unrelated to
    the coordination Intent described here.

    ## Honesty contract

    Every operation carries an `x-ln-status` extension. The portal renders it as a badge and
    never overrides it:

    | Status | What it means |
    |---|---|
    | `implemented` | Live on a public endpoint. Call it today. |
    | `not_yet_wired` | The endpoint is live and returns `200`, but its data source is not connected. It returns zeros/empties **plus** `"source": "not_yet_wired"`. Safe to read; the numbers are not earnings. |
    | `testing` | Code exists and its tests pass, but there is no public endpoint. |
    | `planned` | Designed, not built. There is nothing behind it. |

    `planned` operations are listed so you can see where the network is going. They are **not**
    callable and the SDKs raise a typed `NotYetWiredError` instead of pretending.

    ## Authentication

    Discovery is public — no key, no signup. Operator endpoints use a signature-based login:
    fetch a challenge, sign it with your **device key**, exchange it for a 1-hour bearer session.
    There is no password anywhere in this API, so there is nothing to phish and nothing to stuff.

    ## What this API deliberately does not do

    There is no endpoint that moves value. No wallet, no swap, no staking, no token transfer.
    Credits are a **test unit** — not cash, and not a claim on future value.
  contact:
    name: LibertyNet developer support
    url: https://docs.libertynet.ai/community
  license:
    name: See repository
    url: https://github.com/LibertyNetHQ/libertynet-dev-portal

servers:
  - url: https://registry.libertynet.ai
    description: Production registry (live)
  - url: https://libertynet.ai/coordination
    description: |
      Public coordination gateway (live). Discovery, identity and binding are on the registry;
      the coordination operations are here. Every path under this server carries its own
      `servers` entry, so a generated client routes each operation correctly without the caller
      having to know which host is which.

tags:
  - name: Discovery
    description: Find nodes on the network. Public, no authentication.
  - name: Identity
    description: Operator login by signature. No passwords.
  - name: Binding
    description: The double-signature handshake that binds a node to an operator.
  - name: Node
    description: Endpoints a node daemon calls on its own behalf.
  - name: Economics
    description: Credits and contribution evidence. Live endpoints, unconnected data sources.
  - name: Coordination
    description: |
      Ask the network to do work: Intent → Proposal → Commitment → authorize → Result → Receipt.
      Every operation is authenticated by a signed envelope, reads included, and the settlement
      figure on a Receipt is an accounting record — it moves no value.

paths:
  /health:
    get:
      operationId: getHealth
      summary: Registry liveness
      description: |
        The cheapest possible first call. No key, no headers, no body. If this returns `200`,
        you are talking to the network.
      tags: [Discovery]
      security: []
      x-ln-status: implemented
      responses:
        '200':
          description: Registry is up.
          content:
            application/json:
              schema:
                type: object
                required: [status, service, count]
                properties:
                  status: { type: string, const: ok }
                  service: { type: string, example: libertynet-registry-standalone }
                  count:
                    type: integer
                    description: Number of nodes currently in the registry table.
                    example: 27
              examples:
                live:
                  summary: Real response, probed 2026-07-31
                  value: { status: ok, service: libertynet-registry-standalone, count: 27 }

  /nodes:
    get:
      operationId: listNodes
      summary: List all registered nodes
      description: |
        The full node table. This is how you discover who is on the network and what they can do.

        `last_seen` is the honest freshness signal — a node that stopped heart-beating stays in
        the table with a stale `last_seen`. Do not treat presence in this list as "online";
        compare `last_seen` against now yourself, or use
        [`GET /v1/operator/me/nodes`](#operation/getOperatorNodes) which computes `online` for you.
      tags: [Discovery]
      security: []
      x-ln-status: implemented
      parameters:
        - name: callable
          in: query
          required: false
          schema: { type: string, enum: ['1', 'true'] }
          description: |
            Return only nodes that are **publicly reachable and carry a registration
            signature** — the honest answer to "who can I actually call".

            Most records are neither: of 28 nodes today, 4 advertise RFC1918 addresses and
            13 advertise `node://someones-laptop` labels. Those are real to their operator
            and unreachable from anywhere else. Filtering is opt-in so existing consumers
            keep seeing the complete feed.
      responses:
        '200':
          description: The node table.
          content:
            application/json:
              schema:
                type: object
                required: [count, nodes]
                properties:
                  count: { type: integer, example: 27 }
                  nodes:
                    type: array
                    items: { $ref: '#/components/schemas/NodeRecord' }
              examples:
                live:
                  summary: Real response (one node shown), probed 2026-07-31
                  value:
                    count: 27
                    nodes:
                      - did: 'did:svrp:df9d4b9f390bc49b2210eca81ca3c54c4d63b37b739442a21e28f2ed5b8aa02d'
                        public_key: df9d4b9f390bc49b2210eca81ca3c54c4d63b37b739442a21e28f2ed5b8aa02d
                        endpoint: 172.20.10.5:55785
                        capabilities: [inference, 'health:ready']
                        region: asia-southeast
                        status: active
                        last_seen: '2026-07-31T16:33:08Z'
                        first_seen: '2026-07-28T11:49:46Z'

  /peers:
    get:
      operationId: listPeersText
      summary: List peers as plain text
      description: |
        One peer per line: `<did> <public_key> <endpoint>`. Exists for shell tooling that would
        rather not depend on a JSON parser. Prefer [`/nodes`](#operation/listNodes) in code.
      tags: [Discovery]
      security: []
      x-ln-status: implemented
      responses:
        '200':
          description: Newline-delimited peer list.
          content:
            text/plain:
              schema: { type: string }
              examples:
                live:
                  value: |
                    did:svrp:n:268d4fe0 7441yUYc1qmWVkAAUrPapKC13MXusEqDvvQJ1Pw5NNfg 34.21.237.177:4001
                    did:svrp:n:5af1b351 8xbsLtBacNvgr3sBwguKExAwEFuGNAQQG54qQKwPshtv 35.241.69.59:4001

  /api/v1/peers:
    get:
      operationId: listPeers
      summary: List peers (JSON envelope)
      tags: [Discovery]
      security: []
      x-ln-status: not_yet_wired
      responses:
        '200':
          description: Peer list wrapped in the standard envelope.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  data: { type: array, items: { $ref: '#/components/schemas/NodeRecord' } }
                  error: { type: [string, 'null'] }

  /api/v1/register:
    post:
      operationId: registerNode
      summary: Register a node
      description: |
        A node announces itself to the registry. You normally do **not** call this by hand —
        `ln-node` does it for you on startup. It is documented because self-hosted and
        experimental nodes need the exact contract.

        Signature verification runs in grace mode: a malformed signature is recorded rather than
        rejected outright during the beta. Do not rely on that staying true.
      tags: [Discovery]
      security: []
      x-ln-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '200':
          description: Registered.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  data: { $ref: '#/components/schemas/NodeRecord' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/heartbeat:
    post:
      operationId: heartbeatNode
      summary: Refresh a node's last_seen
      description: |
        Keeps a node's `last_seen` fresh, which is what makes it show as `online` to its operator.
        `ln-node` sends this on an interval; a node that stops sending it goes stale, not deleted.
      tags: [Discovery]
      security: []
      x-ln-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [did]
              properties:
                did: { $ref: '#/components/schemas/Did' }
                public_key: { $ref: '#/components/schemas/PublicKeyHex' }
      responses:
        '200':
          description: Heartbeat accepted.
          content:
            application/json:
              schema:
                type: object
                properties: { ok: { type: boolean } }

  /v1/auth/challenge:
    post:
      operationId: createAuthChallenge
      summary: Get a login challenge
      description: |
        Returns a single-use random challenge with a 300-second TTL. You sign it with your device
        key and hand it back to [`/v1/auth/device-login`](#operation/deviceLogin). The challenge is
        consumed on success and cannot be replayed.
      tags: [Identity]
      security: []
      x-ln-status: implemented
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object }
      responses:
        '200':
          description: A fresh challenge.
          content:
            application/json:
              schema:
                type: object
                required: [challenge, expires_in]
                properties:
                  challenge:
                    type: string
                    description: Base58, 24 random bytes.
                    example: 7xyZt3pE8DSp6JzsSpRMc7o8PSUsH5R2P
                  expires_in: { type: integer, const: 300, description: Seconds. }

  /v1/auth/device-login:
    post:
      operationId: deviceLogin
      summary: Exchange a signed challenge for a bearer session
      description: |
        The registry verifies, in this order, and rejects at the first failure:

        1. **id-binding** — that `operator_root_public_key` actually derives `operator_did`.
        2. the DeviceCredential's own signature by the operator root key;
        3. that the DeviceCredential is inside its validity window;
        4. your signature over the challenge, by the device key the credential names.

        A valid signature is not a valid identity. Step 1 is not optional and not reorderable.

        On success you get a bearer token good for one hour. It is a session, not an API key:
        it is not listed anywhere, not recoverable, and expires on its own.
      tags: [Identity]
      security: []
      x-ln-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_credential, challenge, issued_at, signature]
              properties:
                device_credential: { $ref: '#/components/schemas/DeviceCredential' }
                challenge: { type: string, description: Verbatim from /v1/auth/challenge. }
                issued_at: { $ref: '#/components/schemas/Rfc3339Utc' }
                signature:
                  type: string
                  description: Base58 Ed25519 signature by `device_credential.device_public_key`.
      responses:
        '200':
          description: Logged in.
          content:
            application/json:
              schema:
                type: object
                required: [session_token, operator_did, expires_in]
                properties:
                  session_token: { type: string, description: 'Bearer token. Send as `Authorization: Bearer <token>`.' }
                  operator_did: { $ref: '#/components/schemas/Did' }
                  expires_in: { type: integer, const: 3600 }
        '401':
          description: |
            Rejected. `code` tells you which gate failed: `BAD_CHALLENGE`, `DC_ID_BINDING`,
            `DC_BAD_SIGNATURE`, `DC_EXPIRED`, `BAD_SIGNATURE`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /v1/operator/me/nodes:
    get:
      operationId: getOperatorNodes
      summary: List the nodes bound to you
      description: |
        Every node bound to the authenticated operator, with a computed `online` flag and the
        authorization limits that were agreed at binding time.

        Note the DID subtlety this endpoint resolves for you: a binding is stored under the node's
        short `did:svrp:n:<8hex>` form, but a running daemon announces itself under its full
        `did:svrp:<64hex>` form. Same key, two encodings. This endpoint reconciles them and returns
        the freshest live record.
      tags: [Identity]
      x-ln-status: implemented
      responses:
        '200':
          description: Your nodes.
          content:
            application/json:
              schema:
                type: object
                required: [operator_did, count, nodes]
                properties:
                  operator_did: { $ref: '#/components/schemas/Did' }
                  count: { type: integer }
                  nodes:
                    type: array
                    items: { $ref: '#/components/schemas/BoundNode' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/operator/me/credits:
    get:
      operationId: getOperatorCredits
      summary: Read your Credits balance
      description: |
        **This endpoint is live and returns `200`, but no credits ledger is connected to it.**
        It returns `settled`, `pending` and `estimated` all equal to `0`, together with
        `"source": "not_yet_wired"`.

        That field is the contract. If your UI shows a balance, it must check `source` and say
        "not connected yet" rather than render `0` as an earned amount. The SDKs enforce this:
        reading `.settled` on a `not_yet_wired` response raises rather than returning a
        misleading zero.

        Credits are a **test unit**. Not cash. Not redeemable. Not a claim on future value.
      tags: [Economics]
      x-ln-status: not_yet_wired
      responses:
        '200':
          description: Balance envelope — see `source` before believing any number.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreditsBalance' }
              examples:
                live:
                  summary: Real response today
                  value:
                    operator_did: 'did:svrp:o:<your-operator-id>'
                    unit: test-credit
                    disclaimer: 测试单位，非现金，不代表未来可兑换价值。
                    settled: { amount: 0, meaning: '已入账：由 Evidence 验证与结算系统确认' }
                    pending: { amount: 0, meaning: '待验证：Evidence 已提交，尚未完成验证或结算' }
                    estimated: { amount: 0, meaning: '模拟估算：内测模型估算，不代表承诺或未来价值' }
                    source: not_yet_wired
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/operator/me/evidence:
    get:
      operationId: getOperatorEvidence
      summary: Read your contribution evidence
      description: |
        **Live, but the read-only Evidence source is not connected.** Returns `count: 0`,
        `evidence: []` and `"source": "not_yet_wired"`. Treat an empty list here as "unknown",
        not as "you contributed nothing".
      tags: [Economics]
      x-ln-status: not_yet_wired
      responses:
        '200':
          description: Evidence envelope.
          content:
            application/json:
              schema:
                type: object
                required: [operator_did, count, evidence, source]
                properties:
                  operator_did: { $ref: '#/components/schemas/Did' }
                  count: { type: integer }
                  evidence: { type: array, items: { type: object } }
                  source: { type: string, const: not_yet_wired }
                  note: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/bindings/initiate:
    post:
      operationId: initiateBinding
      summary: Open a binding session (node side)
      description: |
        A node asks to be adopted by an operator. It signs a canonical description of what it is
        and what permissions it wants, and gets back a human-readable `short_code` and a
        `binding_token`.

        **Both are returned exactly once and never again.** They are stored only as SHA-256
        hashes. If you lose them, cancel the session and start over.

        The registry enforces `0 < expires_at - created_at <= 600s`. A node cannot grant itself a
        longer window than the protocol allows.
      tags: [Binding]
      security: []
      x-ln-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BindingInitiateRequest' }
      responses:
        '200':
          description: Session opened. Save `short_code` and `binding_token` now.
          content:
            application/json:
              schema:
                type: object
                required: [binding_session_id, short_code, binding_token, expires_at, state]
                properties:
                  binding_session_id: { type: string }
                  short_code:
                    type: string
                    description: |
                      Human-typeable code from the alphabet `23456789ABCDEFGHJKMNPQRSTUVWXYZ` —
                      no `I`, `O`, `0` or `1`, so it survives being read aloud.
                  binding_token: { type: string, description: 128-bit token, base58. }
                  expires_at: { $ref: '#/components/schemas/Rfc3339Utc' }
                  state: { const: INITIATED }
        '400':
          description: '`TTL_TOO_LONG`, `ALREADY_EXPIRED`, or a missing required field.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '401':
          description: '`ID_BINDING_FAILED`, `ID_BINDING_REQUIRED`, or `BAD_SIGNATURE`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: '`SESSION_EXISTS` — that `binding_session_id` was already used.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /v1/bindings/resolve:
    post:
      operationId: resolveBinding
      summary: Redeem a binding code (console side)
      description: |
        The operator's console redeems the `short_code` (or `binding_token`) and sees exactly what
        the node is requesting, including a fingerprint of its public key to compare out-of-band.

        Anti-enumeration is deliberate here: after 5 failed attempts on a code within 600s you get
        `429`, and *every* failure returns the same generic `404` — not found, expired and already
        used are indistinguishable, so the endpoint cannot be used to probe for valid codes.
      tags: [Binding]
      security: []
      x-ln-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Supply at least one of `binding_token` or `short_code`.
              anyOf:
                - { required: [binding_token] }
                - { required: [short_code] }
              properties:
                binding_token: { type: string }
                short_code: { type: string }
      responses:
        '200':
          description: What the node is asking for.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BindingResolveResponse' }
        '404':
          description: '`NOT_FOUND` — deliberately generic (invalid, expired or already used).'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429':
          description: '`RATE_LIMITED` — 5 failed attempts on this code within 600s.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /v1/bindings/authorize:
    post:
      operationId: authorizeBinding
      summary: Authorize a binding (operator side)
      description: |
        The operator's **device key** signs an AuthorizationCredential naming the node and the
        limits it may operate under. The registry verifies the whole chain
        Root → Device → Authorization, and refuses any authorization whose scope exceeds what the
        node asked for.

        The operator's root key never touches this request. It signed the DeviceCredential once,
        offline; the device key does the day-to-day work.
      tags: [Binding]
      security: []
      x-ln-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [binding_session_id, device_credential, authorization_credential]
              properties:
                binding_session_id: { type: string }
                device_credential: { $ref: '#/components/schemas/DeviceCredential' }
                authorization_credential: { $ref: '#/components/schemas/AuthorizationCredential' }
      responses:
        '200':
          description: Authorized — now waiting on the node to accept.
          content:
            application/json:
              schema:
                type: object
                properties:
                  binding_session_id: { type: string }
                  state: { const: PENDING_NODE_ACCEPTANCE }
        '401':
          description: The credential chain failed. `code` names the failing gate.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: '`BAD_STATE` — the session is not awaiting an operator.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /v1/bindings/{binding_session_id}/status:
    get:
      operationId: getBindingStatus
      summary: Poll a binding session
      tags: [Binding]
      security: []
      x-ln-status: implemented
      parameters:
        - { name: binding_session_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Current state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  binding_session_id: { type: string }
                  state: { $ref: '#/components/schemas/BindingState' }
                  node_did: { $ref: '#/components/schemas/Did' }
                  operator_did: { oneOf: [ { $ref: '#/components/schemas/Did' }, { type: 'null' } ] }
                  expires_at: { $ref: '#/components/schemas/Rfc3339Utc' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/bindings/{binding_session_id}/cancel:
    post:
      operationId: cancelBinding
      summary: Cancel a binding session
      tags: [Binding]
      security: []
      x-ln-status: implemented
      parameters:
        - { name: binding_session_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Cancelled. The code and token are invalidated immediately.
          content:
            application/json:
              schema:
                type: object
                properties:
                  binding_session_id: { type: string }
                  state: { const: CANCELLED }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`BAD_STATE` — already terminal.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /v1/node/bindings/pending:
    post:
      operationId: listPendingBindings
      summary: Poll for authorizations awaiting this node
      description: |
        The node proves who it is on every poll — there is no session for nodes. It signs
        `"libertynet-node-poll:v1\n<node_did>\n<unix_ts>"` and the registry checks id-binding,
        then timestamp skew (±300s), then the signature.
      tags: [Node]
      security: []
      x-ln-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [node_did, node_public_key, ts, signature]
              properties:
                node_did: { $ref: '#/components/schemas/Did' }
                node_public_key: { $ref: '#/components/schemas/PublicKeyB58' }
                ts: { type: integer, description: Unix seconds, within ±300s of registry time. }
                signature: { type: string, description: Base58 Ed25519 over the domain-separated poll message. }
      responses:
        '200':
          description: Sessions waiting for this node to accept.
          content:
            application/json:
              schema:
                type: object
                properties:
                  pending:
                    type: array
                    items:
                      type: object
                      properties:
                        binding_session_id: { type: string }
                        operator_did: { $ref: '#/components/schemas/Did' }
                        nonce: { type: string }
                        expires_at: { $ref: '#/components/schemas/Rfc3339Utc' }
                        device_credential: { $ref: '#/components/schemas/DeviceCredential' }
                        authorization_credential: { $ref: '#/components/schemas/AuthorizationCredential' }
        '401':
          description: '`ID_BINDING_FAILED`, `STALE_TS`, or `BAD_SIGNATURE`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /v1/node/bindings/{binding_session_id}/accept:
    post:
      operationId: acceptBinding
      summary: Accept a binding (node side)
      description: |
        The final step. Before writing anything, the registry re-verifies **all four signatures**
        atomically — node session, operator root over device, device over authorization, and node
        acceptance. Only then does the session become `ACTIVE`.


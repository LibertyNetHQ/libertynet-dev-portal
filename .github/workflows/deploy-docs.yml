name: Deploy docs

# Builds the site on every push to main and publishes it as an artifact.
#
# The upload to node-1 is NOT automated here on purpose: it would need a service
# account key with SSH access to the box that also serves the registry, stored as
# a repository secret. That is a meaningful widening of blast radius for a
# documentation change, and it is David's call rather than a default.
#
# Until then `./site/deploy.sh` from a machine that already has gcloud auth does
# the same thing in about thirty seconds.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build
        run: node site/build.mjs

      - name: Check nothing dishonest slipped in
        run: node tools/check-docs-drift.mjs

      - name: Report what was built
        run: |
          {
            echo "## Docs build"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| pages | $(find site/dist -name index.html | wc -l) |"
            echo "| size | $(du -sh site/dist | cut -f1) |"
            echo
            echo "Deploy with \`./site/deploy.sh\` (needs gcloud auth for node-1)."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site/dist
          retention-days: 14

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  suite:
    name: Tests and honesty checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SDK dependencies
        working-directory: sdk/typescript
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Install pytest
        run: python -m pip install --quiet pytest

      # Runs the docs honesty checker, the example safety checker, both SDK
      # suites, the scaffolder, the MCP server and a TypeScript strict typecheck.
      # Hermetic — no network — so it cannot go red because a server blipped.
      - name: Full suite
        run: node tools/check-all.mjs

      - name: Build the docs site
        run: node site/build.mjs

      # Golden questions, including adversarial ones, run against the same tools
      # and corpus an assistant would use. A wrong answer here is a documentation
      # bug that would otherwise only surface as a developer writing code for a
      # feature that does not exist.
      - name: AI answer quality
        run: node tools/check-ai-answers.mjs

  # A required job of its own, deliberately.
  #
  # This used to sit inside the advisory `live` job, where a red result changed
  # nothing — which is how a dozen links into a private repository stayed
  # published. A rule that cannot fail a pull request is a preference.
  #
  # It is separate from the main suite so a GitHub outage fails one obvious job
  # that can be re-run, rather than the job that gates every change. The check
  # retries four times before calling a link unreachable, and an unreachable
  # link still fails: "we could not check it" is not "it works".
  links:
    name: Links, as a stranger sees them
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # No credentials of any kind. GitHub answers 404 rather than 403 for a
      # repository you cannot see, so checking as ourselves would prove nothing
      # and would prove it convincingly.
      - name: Every link, fetched anonymously
        run: node tools/check-external-links.mjs

  live:
    name: Live network agreement
    runs-on: ubuntu-latest
    # Not required for merge: this can go red because the network is down rather
    # than because the change is wrong. It is here to be noticed, not to block.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Does what the docs claim still match what the API does?
      - name: API sync
        run: node tools/check-api-sync.mjs

      # Fetched with no credentials, on purpose: a private repository answers
      # 404 to strangers and 200 to us, so checking as ourselves proves nothing.
      # Every `implemented` claim, measured against the running system —
      # including a full operator login with a freshly generated identity, so
      # the endpoints behind auth stop being taken on trust.
      # Builds a DeviceCredential strictly from the published OpenAPI schema and
      # requires the live registry to accept it. The schema said seven fields
      # where the registry signs nine, and every test passed anyway, because
      # nothing here had ever built one from the documentation.
      - name: Published credential schema actually works
        run: node tools/check-credential-schema.mjs

      - name: Audit every implemented claim
        run: node tools/audit-implemented.mjs

      - name: External links, as an anonymous reader sees them
        run: node tools/check-external-links.mjs

      # The install instructions on /ai/mcp, executed against the live network:
      # one downloaded file in an empty directory, all six tools called.
      - name: Bundle the MCP server
        run: node tools/bundle-mcp.mjs

      - name: MCP bundle, clean environment, live network
        run: node mcp-server/test/bundle.e2e.mjs

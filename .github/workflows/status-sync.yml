name: Status sync

# E1 — the capability matrix is genuinely authoritative.
#
# `api-spec/status.json` is described everywhere as the single source of truth.
# This is what makes that a fact rather than an intention: change a status there
# and the OpenAPI spec, both SDKs and the docs table are regenerated from it. Edit
# a generated file by hand and the build fails, the same way `gofmt -l` fails.
#
# On a pull request it checks. On a push to main it also opens a PR with the
# regenerated files, so a matrix change made through the GitHub UI does not sit
# there half-applied.

on:
  pull_request:
    paths:
      - "api-spec/status.json"
      - "tools/sync-status.mjs"
      - "sdk/**/capabilities.*"
      - "api-spec/libertynet-v1.yaml"
      - "docs-site/snippets/capability-table.mdx"
  push:
    branches: [main]
    paths:
      - "api-spec/status.json"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    name: Generated files match the matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check
        id: check
        run: |
          set +e
          node tools/sync-status.mjs --check
          echo "stale=$?" >> "$GITHUB_OUTPUT"

      # On a PR, being stale is simply an error: the author should run the tool.
      - name: Fail the PR if stale
        if: github.event_name == 'pull_request' && steps.check.outputs.stale != '0'
        run: |
          echo "::error::Generated files do not match api-spec/status.json. Run: node tools/sync-status.mjs"
          exit 1

      # On main — most likely a matrix edit through the web UI — regenerate and
      # open a PR rather than pushing straight to the branch. The whole point of
      # this repository is that claims get reviewed.
      - name: Regenerate and open a PR
        if: github.event_name != 'pull_request' && steps.check.outputs.stale != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="status-sync/$(date -u +%Y-%m-%d-%H%M)"

          git config user.name  "libertynet-docs-bot"
          git config user.email "noreply@libertynet.ai"
          git checkout -b "$BRANCH"

          node tools/sync-status.mjs
          git add -A

          git commit -m "chore: regenerate artifacts from the capability matrix

          api-spec/status.json changed and the derived files had not been
          regenerated. This is that regeneration, nothing else — no prose was
          touched, because a machine should not write the paragraph explaining
          what a newly-shipped capability does."

          git push -u origin "$BRANCH"
          gh pr create \
            --title "chore: regenerate artifacts from the capability matrix" \
            --body "\`api-spec/status.json\` changed. This regenerates the OpenAPI \`x-ln-status\` values, both SDK capability maps and the docs table.

          Only generated files are touched. Prose is never generated — a capability moving to \`implemented\` needs a human to write what it does.

          Generated by \`tools/sync-status.mjs\`." \
            --label "documentation"

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.check.outputs.stale }}" = "0" ]; then
            echo "## Generated files are in sync" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Generated files were stale" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo 'Run `node tools/sync-status.mjs`.' >> "$GITHUB_STEP_SUMMARY"
          fi

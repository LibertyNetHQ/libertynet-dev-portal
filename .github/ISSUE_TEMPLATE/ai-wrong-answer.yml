name: An AI assistant gave a wrong answer
description: Your assistant said something false about LibertyNet
labels: [ai-answer, documentation]
body:
  - type: markdown
    attributes:
      value: |
        **A wrong AI answer is usually a documentation bug.** An assistant mirrors what it
        reads, so if it confidently said something false, some page probably allows that
        reading — and fixing the page fixes every future answer at once.

        Reports here feed `tools/check-ai-answers.mjs`, which runs golden questions in CI.
  - type: input
    id: question
    attributes:
      label: What you asked
    validations: { required: true }
  - type: textarea
    id: answer
    attributes:
      label: What it said
    validations: { required: true }
  - type: textarea
    id: truth
    attributes:
      label: What is actually true
      description: If you know which page misled it, say which.
    validations: { required: true }
  - type: dropdown
    id: tools
    attributes:
      label: Did it have the MCP server?
      options: ["No", "Yes", "Not sure"]
    validations: { required: true }

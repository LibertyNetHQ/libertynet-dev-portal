<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="LibertyNet">
  <title>LibertyNet</title>
  <!--
    Favicon: the mark alone, on its pure-black ground.

    Deliberately NOT animated. A moving favicon is a notification, and nothing
    here is notifying anyone — that is exactly the kind of motion the 95%-silence
    rule exists to forbid. The tab icon is the mark at rest.
  -->
  <rect width="32" height="32" rx="7" fill="#000000" />
  <g fill="none" stroke="#00E5C7" stroke-linecap="round">
    <path d="M16 5.5 A10.5 10.5 0 0 1 25.7 12" stroke-width="2" />
    <path d="M16 26.5 A10.5 10.5 0 0 1 6.3 20" stroke-width="2" />
    <path d="M23.4 8.6 A10.5 10.5 0 0 1 22 23.9" stroke-width="1.4" opacity="0.6" />
  </g>
  <circle cx="16" cy="16" r="3" fill="#00E5C7" />
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 32" width="176" height="32" role="img" aria-label="LibertyNet">
  <title>LibertyNet</title>
  <!--
    LivingMark — the mark is not a fixed picture.

    Three arcs orbit at 43s, 61s and 79s. Those periods are pairwise coprime, so
    the combined figure does not repeat for 43×61×79 = 207,217 seconds (~2.4
    days) of continuous display. Every visit lands on a different arrangement.
    Nothing is baked into a raster; the mark is regenerated by the renderer each
    frame from these three rotations.

    Motion is inside the 95%-silence budget: at ~8°/s the fastest arc moves less
    than a pixel per frame at this size. It reads as still. It stops completely
    under prefers-reduced-motion.
  -->
  <style>
    .ring { fill: none; stroke: #00E5C7; stroke-linecap: round; transform-origin: 16px 16px; }
    .r1 { stroke-width: 1.6; opacity: 0.95; animation: spin 43s linear infinite; }
    .r2 { stroke-width: 1.2; opacity: 0.62; animation: spin 61s linear infinite reverse; }
    .r3 { stroke-width: 1;   opacity: 0.38; animation: spin 79s linear infinite; }
    .core { fill: #00E5C7; animation: pulse 43s ease-in-out infinite; }
    .word { fill: #E6EFEC; font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 15px; font-weight: 250; letter-spacing: 0.01em; }
    .word tspan { fill: #00E5C7; font-weight: 400; }
    @keyframes spin  { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { opacity: 0.8; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .ring, .core { animation: none; }
    }
  </style>

  <!-- three open arcs, deliberately unequal so the figure never looks symmetric -->
  <path class="ring r1" d="M16 4.5 A11.5 11.5 0 0 1 26.6 11.4" />
  <path class="ring r1" d="M16 27.5 A11.5 11.5 0 0 1 5.4 20.6" />
  <path class="ring r2" d="M24.1 7.9 A11.5 11.5 0 0 1 22.6 24.9" />
  <path class="ring r3" d="M7.4 9.2 A11.5 11.5 0 0 0 8.9 25.4" />
  <circle class="core" cx="16" cy="16" r="3.1" />

  <text class="word" x="40" y="21">Liberty<tspan>Net</tspan></text>
</svg>

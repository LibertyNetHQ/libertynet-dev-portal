<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 32" width="176" height="32" role="img" aria-label="LibertyNet">
  <title>LibertyNet</title>
  <!--
    LivingMark, light-ground variant. Same three coprime rotations (43s / 61s /
    79s) as the dark mark, so the two are the same living object rather than two
    different logos.

    Pigment differs because contrast does: #00E5C7 measures 1.6:1 on white, far
    below AA, so on light grounds the mark carries the deepened life cyan
    #007A69 (5.3:1) instead. The hue is the brand; the value is whatever keeps it
    readable.
  -->
  <style>
    .ring { fill: none; stroke: #007A69; stroke-linecap: round; transform-origin: 16px 16px; }
    .r1 { stroke-width: 1.6; opacity: 0.95; animation: spin 43s linear infinite; }
    .r2 { stroke-width: 1.2; opacity: 0.66; animation: spin 61s linear infinite reverse; }
    .r3 { stroke-width: 1;   opacity: 0.44; animation: spin 79s linear infinite; }
    .core { fill: #007A69; animation: pulse 43s ease-in-out infinite; }
    .word { fill: #10201C; font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 15px; font-weight: 250; letter-spacing: 0.01em; }
    .word tspan { fill: #007A69; font-weight: 400; }
    @keyframes spin  { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { opacity: 0.82; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .ring, .core { animation: none; }
    }
  </style>

  <path class="ring r1" d="M16 4.5 A11.5 11.5 0 0 1 26.6 11.4" />
  <path class="ring r1" d="M16 27.5 A11.5 11.5 0 0 1 5.4 20.6" />
  <path class="ring r2" d="M24.1 7.9 A11.5 11.5 0 0 1 22.6 24.9" />
  <path class="ring r3" d="M7.4 9.2 A11.5 11.5 0 0 0 8.9 25.4" />
  <circle class="core" cx="16" cy="16" r="3.1" />

  <text class="word" x="40" y="21">Liberty<tspan>Net</tspan></text>
</svg>
